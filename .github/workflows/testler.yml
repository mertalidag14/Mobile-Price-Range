# Depoya her kod yüklendiğinde testler GitHub'ın sunucusunda otomatik çalışır.
# Sonuç README'deki "Testler" rozetinde görünür (yeşil = hepsi geçti).
name: Testler

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"   # Render'daki Docker ile aynı sürüm
          cache: pip
          cache-dependency-path: web_arayuzu/requirements.txt
      - name: Kütüphaneleri kur
        run: pip install -r web_arayuzu/requirements.txt pytest
      - name: Testleri çalıştır
        run: pytest testler -v
