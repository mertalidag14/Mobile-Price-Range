# Render'ın ücretsiz planında site 15 dakika ziyaret edilmezse uyur ve ilk açılış
# (özellikle telefondan) siyah/bekleme ekranıyla 50 saniyeye kadar sürebilir.
# Bu iş her 10 dakikada bir siteye istek atarak onu uyanık tutar.
name: Siteyi uyanık tut

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: TeknoTahmin'e istek at
        run: curl -fsS -o /dev/null -w "HTTP %{http_code}\n" --max-time 90 https://teknotahmin-0iji.onrender.com/ || true
